<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quel aquaculteur es-tu ? — Halieutis Club</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --deep: #031d2b;
    --ocean: #064b68;
    --blue: #087fa3;
    --cyan: #12bfd5;
    --light: #e9f9fc;
    --white: #ffffff;
    --text: #073047;
}

body {
    min-height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 10%, rgba(18,191,213,.25), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(0,126,163,.25), transparent 35%),
        linear-gradient(145deg, #021a27, #064b68 55%, #03293b);
    color: var(--white);
    overflow-x: hidden;
}

/* =========================
   OCEAN BACKGROUND
========================= */

.ocean {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.bubble {
    position: absolute;
    bottom: -100px;
    border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.05);
    border-radius: 50%;
    animation: rise linear infinite;
}

.bubble:nth-child(1) {
    width: 18px;
    height: 18px;
    left: 8%;
    animation-duration: 11s;
}

.bubble:nth-child(2) {
    width: 9px;
    height: 9px;
    left: 22%;
    animation-duration: 8s;
    animation-delay: 2s;
}

.bubble:nth-child(3) {
    width: 25px;
    height: 25px;
    left: 43%;
    animation-duration: 13s;
    animation-delay: 1s;
}

.bubble:nth-child(4) {
    width: 12px;
    height: 12px;
    left: 66%;
    animation-duration: 9s;
    animation-delay: 3s;
}

.bubble:nth-child(5) {
    width: 20px;
    height: 20px;
    left: 85%;
    animation-duration: 12s;
    animation-delay: 1s;
}

@keyframes rise {
    0% {
        transform: translateY(0);
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    100% {
        transform: translateY(-120vh);
        opacity: 0;
    }
}


/* =========================
   MAIN CONTAINER
========================= */

.app {
    position: relative;
    z-index: 2;
    width: min(920px, calc(100% - 30px));
    margin: 30px auto;
}


/* =========================
   HEADER
========================= */

.header {
    text-align: center;
    margin-bottom: 20px;
}

.club-name {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #8eeaf4;
    margin-bottom: 12px;
}

.header h1 {
    font-size: clamp(34px, 7vw, 64px);
    line-height: 1;
    letter-spacing: -2px;
    margin-bottom: 14px;
}

.header h1 span {
    color: var(--cyan);
}

.header p {
    color: rgba(255,255,255,.75);
    font-size: 16px;
}


/* =========================
   QUIZ CARD
========================= */

.quiz-card {
    background: rgba(255,255,255,.97);
    color: var(--text);
    border-radius: 30px;
    overflow: hidden;
    box-shadow:
        0 30px 90px rgba(0,0,0,.35),
        0 0 0 1px rgba(255,255,255,.15);
}


/* =========================
   TOP BAR
========================= */

.top-bar {
    padding: 22px 30px 0;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 9px;
    color: #68818c;
    font-size: 13px;
    font-weight: 700;
}

.progress-track {
    width: 100%;
    height: 9px;
    background: #e3edf0;
    border-radius: 20px;
    overflow: hidden;
}

.progress {
    width: 10%;
    height: 100%;
    background: linear-gradient(
        90deg,
        #006c91,
        #0cc4d6
    );
    border-radius: inherit;
    transition: width .5s ease;
}


/* =========================
   QUESTION AREA
========================= */

.question-area {
    padding: 35px 30px 30px;
}

.question-tag {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: #0084a5;
    background: #e8f8fb;
    padding: 7px 12px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: 800;
    margin-bottom: 15px;
}

.question {
    font-size: clamp(25px, 5vw, 38px);
    line-height: 1.15;
    margin-bottom: 28px;
    color: #06354c;
}


/* =========================
   ANSWERS
========================= */

.answers {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.answer {
    position: relative;
    border: 2px solid #dce9ed;
    border-radius: 19px;
    padding: 18px;
    min-height: 95px;
    background: #fff;
    cursor: pointer;
    color: var(--text);
    text-align: left;
    transition:
        transform .2s ease,
        border-color .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.answer:hover {
    transform: translateY(-3px);
    border-color: #53b9ca;
    box-shadow: 0 8px 25px rgba(0,100,130,.1);
}

.answer.selected {
    border-color: #0088a8;
    background: #eafafd;
    box-shadow:
        0 8px 25px rgba(0,126,163,.15),
        inset 0 0 0 1px #0088a8;
}

.answer-icon {
    font-size: 29px;
    display: block;
    margin-bottom: 8px;
}

.answer-text {
    font-size: 15px;
    font-weight: 650;
    line-height: 1.35;
}

.answer-check {
    position: absolute;
    right: 13px;
    top: 13px;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    display: none;
    justify-content: center;
    align-items: center;
    background: #0088a8;
    color: white;
    font-size: 13px;
}

.answer.selected .answer-check {
    display: flex;
}


/* =========================
   NAVIGATION
========================= */

.navigation {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 30px 30px;
}

.hint {
    color: #82979f;
    font-size: 13px;
}

.next {
    border: none;
    background: linear-gradient(
        135deg,
        #007b9d,
        #00516e
    );
    color: white;
    padding: 15px 27px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 750;
    cursor: pointer;
    transition: .2s;
}

.next:hover {
    transform: translateY(-2px);
    box-shadow: 0 9px 25px rgba(0,90,120,.25);
}

.next:disabled {
    opacity: .4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}


/* =========================
   RESULT
========================= */

.result {
    display: none;
    text-align: center;
    padding: 50px 30px 55px;
}

.result.show {
    animation: resultAppear .7s ease;
}

@keyframes resultAppear {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.result-icon {
    width: 120px;
    height: 120px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        linear-gradient(
            135deg,
            #e7fafd,
            #c9f0f5
        );
    font-size: 65px;
    box-shadow:
        0 15px 35px rgba(0,130,160,.15);
    animation: float 2.5s ease-in-out infinite;
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

.result-label {
    color: #0085a5;
    text-transform: uppercase;
    font-weight: 800;
    letter-spacing: 3px;
    font-size: 12px;
}

.result h2 {
    color: #06354c;
    font-size: clamp(34px, 7vw, 54px);
    margin: 8px 0 15px;
}

.result-description {
    max-width: 650px;
    margin: auto;
    color: #607985;
    font-size: 17px;
    line-height: 1.7;
}

.result-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    max-width: 650px;
    margin: 30px auto;
}

.result-point {
    padding: 17px;
    background: #f1fafc;
    border: 1px solid #d8edf1;
    border-radius: 15px;
    color: #315968;
    font-size: 14px;
    font-weight: 600;
}

.result-point::first-letter {
    color: #0086a6;
}

.restart {
    border: 2px solid #0083a4;
    background: white;
    color: #00718f;
    padding: 13px 25px;
    border-radius: 13px;
    font-weight: 750;
    cursor: pointer;
    transition: .2s;
}

.restart:hover {
    background: #eaf9fc;
}


/* =========================
   FOOTER
========================= */

.footer {
    text-align: center;
    color: rgba(255,255,255,.5);
    font-size: 12px;
    margin-top: 18px;
    letter-spacing: .5px;
}


/* =========================
   MOBILE
========================= */

@media(max-width: 650px) {

    .app {
        width: calc(100% - 14px);
        margin: 15px auto;
    }

    .header h1 {
        font-size: 36px;
    }

    .answers {
        grid-template-columns: 1fr;
    }

    .answer {
        min-height: 75px;
    }

    .result-grid {
        grid-template-columns: 1fr;
    }

    .question-area {
        padding: 28px 20px 25px;
    }

    .top-bar {
        padding: 18px 20px 0;
    }

    .navigation {
        padding: 0 20px 25px;
    }

    .hint {
        display: none;
    }

}

</style>
</head>


<body>


<!-- ANIMATED OCEAN -->
<div class="ocean">

    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

</div>


<div class="app">


    <!-- HEADER -->

    <header class="header">

        <div class="club-name">
            HALIEUTIS CLUB • FSTT
        </div>

        <h1>
            Quel <span>aquaculteur</span> es-tu ?
        </h1>

        <p>
            10 questions · 1 profil · 100% aquaculture
        </p>

    </header>


    <main class="quiz-card">


        <!-- PROGRESS -->

        <div class="top-bar">

            <div class="progress-info">

                <span id="progressText">
                    Question 1 sur 10
                </span>

                <span id="percentage">
                    10%
                </span>

            </div>

            <div class="progress-track">

                <div
                    class="progress"
                    id="progress">
                </div>

            </div>

        </div>


        <!-- QUIZ -->

        <section
            class="question-area"
            id="quiz">

            <div class="question-tag">
                🌊 AQUACULTURE QUIZ
            </div>

            <h2
                class="question"
                id="question">
            </h2>

            <div
                class="answers"
                id="answers">
            </div>

        </section>


        <!-- NAVIGATION -->

        <div
            class="navigation"
            id="navigation">

            <span class="hint">
                Choisis la réponse qui te correspond le plus
            </span>

            <button
                class="next"
                id="next"
                disabled>

                Suivant →

            </button>

        </div>


        <!-- RESULT -->

        <section
            class="result"
            id="result">

            <div
                class="result-icon"
                id="resultIcon">
            </div>

            <div class="result-label">
                TON PROFIL AQUACOLE
            </div>

            <h2 id="resultTitle">
            </h2>

            <p
                class="result-description"
                id="resultDescription">
            </p>


            <div
                class="result-grid"
                id="resultPoints">
            </div>


            <button
                class="restart"
                id="restart">

                ↻ Refaire le quiz

            </button>

        </section>


    </main>


    <div class="footer">
        Tomorrow's ocean starts with us. 🌊
    </div>


</div>



<script>


/* =====================================================
   QUESTIONS
===================================================== */

const questions = [

    {
        question:
            "Quel environnement t'attire le plus ?",

        answers: [

            ["🌊", "La mer et les zones côtières", "marin"],

            ["💧", "Un bassin d'eau douce", "poisson"],

            ["🌱", "Un système poissons + plantes", "aquaponie"],

            ["🦪", "Une zone de coquillages", "coquillage"]

        ]
    },


    {
        question:
            "Quel organisme aimerais-tu principalement élever ?",

        answers: [

            ["🐟", "Des poissons", "poisson"],

            ["🦪", "Des moules ou des huîtres", "coquillage"],

            ["🦐", "Des crevettes", "crevette"],

            ["🌿", "Des plantes grâce à l'eau d'élevage", "aquaponie"]

        ]
    },


    {
        question:
            "Quel type de projet te motive le plus ?",

        answers: [

            ["🏭", "Une grande production destinée au marché", "poisson"],

            ["🔬", "Expérimenter et optimiser un système", "aquaponie"],

            ["🌊", "Travailler directement dans le milieu marin", "marin"],

            ["🦪", "Développer une production de coquillages", "coquillage"]

        ]
    },


    {
        question:
            "Quel paramètre environnemental t'intéresse le plus ?",

        answers: [

            ["🌡️", "La température de l'eau", "poisson"],

            ["🧂", "La salinité", "marin"],

            ["💧", "La qualité et le recyclage de l'eau", "aquaponie"],

            ["🌊", "Les conditions du littoral", "coquillage"]

        ]
    },


    {
        question:
            "Imagine que tu dois construire une ferme aquacole. Où l'installes-tu ?",

        answers: [

            ["🏞️", "À terre, avec des bassins", "poisson"],

            ["🌊", "En mer, avec des cages", "marin"],

            ["🌱", "Dans une serre avec des plantes", "aquaponie"],

            ["🦪", "Dans une zone côtière adaptée", "coquillage"]

        ]
    },


    {
        question:
            "Quel problème aimerais-tu résoudre ?",

        answers: [

            ["🐟", "Améliorer la croissance des poissons", "poisson"],

            ["♻️", "Réduire la consommation d'eau", "aquaponie"],

            ["🌊", "Trouver le meilleur site pour une ferme marine", "marin"],

            ["🦪", "Améliorer la production de coquillages", "coquillage"]

        ]
    },


    {
        question:
            "Quel équipement aimerais-tu utiliser ?",

        answers: [

            ["📊", "Des capteurs pour surveiller l'eau", "poisson"],

            ["🗺️", "Un SIG pour sélectionner un site", "marin"],

            ["💦", "Un système de filtration et de recyclage", "aquaponie"],

            ["🌊", "Des installations en zone côtière", "coquillage"]

        ]
    },


    {
        question:
            "Quel sujet scientifique t'intéresse le plus ?",

        answers: [

            ["🧬", "Biologie et physiologie des poissons", "poisson"],

            ["🌍", "Océanographie et environnement marin", "marin"],

            ["🦠", "Microbiologie et cycle des nutriments", "aquaponie"],

            ["🦪", "Biologie des mollusques", "coquillage"]

        ]
    },


    {
        question:
            "Quel résultat aimerais-tu obtenir ?",

        answers: [

            ["🐟", "Produire des poissons de qualité", "poisson"],

            ["🌱", "Produire des poissons et des végétaux ensemble", "aquaponie"],

            ["🌊", "Développer une ferme durable en mer", "marin"],

            ["🦪", "Valoriser les ressources côtières", "coquillage"]

        ]
    },


    {
        question:
            "Dernière question : qu'est-ce qui te ressemble le plus ?",

        answers: [

            ["🐟", "J'aime optimiser et contrôler un système", "poisson"],

            ["🌱", "J'aime connecter plusieurs systèmes ensemble", "aquaponie"],

            ["🌊", "J'aime travailler avec l'océan", "marin"],

            ["🦪", "J'aime les écosystèmes côtiers", "coquillage"]

        ]
    }

];


/* =====================================================
   PROFILES
===================================================== */

const profiles = {

    poisson: {

        icon: "🐟",

        title: "Pisciculteur",

        description:
            "Tu es attiré par l'élevage de poissons et par la maîtrise des conditions nécessaires à leur croissance, leur santé et leur bien-être.",

        points: [
            "Gestion de la qualité de l'eau",
            "Alimentation et croissance",
            "Température et oxygène dissous",
            "Optimisation des systèmes d'élevage"
        ]

    },


    coquillage: {

        icon: "🦪",

        title: "Conchyliculteur",

        description:
            "Tu t'intéresses aux coquillages et au fonctionnement des écosystèmes côtiers qui permettent leur production.",

        points: [
            "Élevage de moules et huîtres",
            "Qualité du milieu marin",
            "Gestion des zones côtières",
            "Aquaculture durable"
        ]

    },


    aquaponie: {

        icon: "🌱",

        title: "Aquaponiste",

        description:
            "Tu aimes les systèmes innovants qui connectent l'élevage aquatique et la production végétale.",

        points: [
            "Poissons + plantes",
            "Recyclage de l'eau",
            "Valorisation des nutriments",
            "Systèmes aquacoles intégrés"
        ]

    },


    marin: {

        icon: "🌊",

        title: "Aquaculteur marin",

        description:
            "Tu es attiré par l'océan et par les défis liés au développement d'une aquaculture durable en milieu marin.",

        points: [
            "Température et salinité",
            "Courants et qualité de l'eau",
            "Choix des sites aquacoles",
            "Aquaculture en mer"
        ]

    },


    crevette: {

        icon: "🦐",

        title: "Crevetticulteur",

        description:
            "Tu t'intéresses aux systèmes d'élevage de crevettes et aux conditions environnementales nécessaires à leur production.",

        points: [
            "Gestion de la qualité de l'eau",
            "Salinité et température",
            "Alimentation et croissance",
            "Gestion des systèmes d'élevage"
        ]

    }

};


/* =====================================================
   VARIABLES
===================================================== */

let currentQuestion = 0;

let selected = null;

let scores = {

    poisson: 0,

    coquillage: 0,

    aquaponie: 0,

    marin: 0,

    crevette: 0

};


/* =====================================================
   DOM
===================================================== */

const questionElement =
    document.getElementById("question");

const answersElement =
    document.getElementById("answers");

const nextButton =
    document.getElementById("next");

const progress =
    document.getElementById("progress");

const progressText =
    document.getElementById("progressText");

const percentage =
    document.getElementById("percentage");

const quiz =
    document.getElementById("quiz");

const navigation =
    document.getElementById("navigation");

const result =
    document.getElementById("result");


/* =====================================================
   DISPLAY QUESTION
===================================================== */

function displayQuestion() {

    const q = questions[currentQuestion];

    selected = null;

    nextButton.disabled = true;

    questionElement.textContent =
        q.question;

    answersElement.innerHTML = "";


    q.answers.forEach((answer, index) => {

        const button =
            document.createElement("button");

        button.className = "answer";

        button.type = "button";

        button.innerHTML = `

            <span class="answer-icon">
                ${answer[0]}
            </span>

            <span class="answer-text">
                ${answer[1]}
            </span>

            <span class="answer-check">
                ✓
            </span>

        `;


        button.addEventListener("click", () => {

            document
                .querySelectorAll(".answer")
                .forEach(a =>
                    a.classList.remove("selected")
                );


            button.classList.add("selected");

            selected = answer[2];

            nextButton.disabled = false;

        });


        answersElement.appendChild(button);

    });


    const percent =
        ((currentQuestion + 1) /
        questions.length) * 100;


    progress.style.width =
        percent + "%";


    progressText.textContent =
        `Question ${currentQuestion + 1} sur ${questions.length}`;


    percentage.textContent =
        Math.round(percent) + "%";


    if (
        currentQuestion ===
        questions.length - 1
    ) {

        nextButton.textContent =
            "Découvrir mon profil 🐟";

    } else {

        nextButton.textContent =
            "Suivant →";

    }

}


/* =====================================================
   NEXT
===================================================== */

nextButton.addEventListener(
    "click",
    () => {

        if (!selected) return;


        scores[selected]++;


        currentQuestion++;


        if (
            currentQuestion <
            questions.length
        ) {

            displayQuestion();

        } else {

            displayResult();

        }

    }
);


/* =====================================================
   RESULT
===================================================== */

function displayResult() {

    let winner =
        Object.keys(scores).reduce(
            (a, b) =>
                scores[a] >= scores[b]
                    ? a
                    : b
        );


    const profile =
        profiles[winner];


    document.getElementById(
        "resultIcon"
    ).textContent =
        profile.icon;


    document.getElementById(
        "resultTitle"
    ).textContent =
        profile.title;


    document.getElementById(
        "resultDescription"
    ).textContent =
        profile.description;


    const points =
        document.getElementById(
            "resultPoints"
        );


    points.innerHTML = "";


    profile.points.forEach(point => {

        const div =
            document.createElement("div");

        div.className =
            "result-point";

        div.textContent =
            "✓ " + point;

        points.appendChild(div);

    });


    quiz.style.display = "none";

    navigation.style.display = "none";

    result.style.display = "block";

    result.classList.add("show");

}


/* =====================================================
   RESTART
===================================================== */

document
    .getElementById("restart")
    .addEventListener("click", () => {

        currentQuestion = 0;

        selected = null;


        scores = {

            poisson: 0,

            coquillage: 0,

            aquaponie: 0,

            marin: 0,

            crevette: 0

        };


        result.style.display = "none";

        result.classList.remove("show");

        quiz.style.display = "block";

        navigation.style.display = "flex";


        displayQuestion();

    });


/* =====================================================
   START
===================================================== */

displayQuestion();

</script>

</body>
</html>
